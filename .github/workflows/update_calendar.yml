name: Aggiornamento Calendario Gare

on:
  schedule:
    - cron: '0 3 * * 1' # Esegue ogni lunedì notte alle 3:00 AM UTC
  workflow_dispatch: # Permette di eseguire il bot anche manualmente cliccando un tasto

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Scarica il codice dal repository
      uses: actions/checkout@v7

    - name: Prepara l'ambiente Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Installa le librerie necessarie
      run: pip install -r requirements.txt

    - name: Esegui lo script Scraper
      run: python scraper.py

    - name: Salva il nuovo JSON e fai il Push su GitHub
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add races_calendar.json
        if git diff --cached --quiet; then
          echo "Nessuna modifica al calendario."
        else
          git commit -m "Aggiornamento automatico gare settimanale"
          git push
        fi
