name: Pulizia storico Actions

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simula senza cancellare'
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Elimina le run vecchie
      uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 5
        delete_run_by_conclusion_pattern: success,cancelled,skipped
        dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
